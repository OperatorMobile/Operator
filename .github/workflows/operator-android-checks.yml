name: Operator Android Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-and-rust:
    name: Android and Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;30.0.14904198"

      - name: Install host native packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev pkg-config

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Write local Android config
        run: |
          cat > mobile/android/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          cargo.path=$HOME/.cargo/bin/cargo
          native.abis=arm64-v8a
          EOF

      - name: Validate local Android environment
        run: scripts/validate-android-local-env.sh

      - name: Check artifact build script syntax
        run: bash -n scripts/build-rusty-v8-android-artifacts.sh

      - name: Check Rust bridge on host
        working-directory: operator-rs/mobile-android-engine
        run: cargo check --locked

      - name: Compile Play Kotlin without native artifact build
        working-directory: mobile/android
        run: ./gradlew :app:compilePlayDebugKotlin -x buildOperatorEngine -x buildOperatorEngineArm64V8a

      - name: Compile Full Kotlin without native artifact build
        working-directory: mobile/android
        run: ./gradlew :app:compileFullDebugKotlin -x buildOperatorEngine -x buildOperatorEngineArm64V8a

      - name: Run Play Android unit test task without native artifact build
        working-directory: mobile/android
        run: ./gradlew :app:testPlayDebugUnitTest -x buildOperatorEngine -x buildOperatorEngineArm64V8a

      - name: Run Full Android unit test task without native artifact build
        working-directory: mobile/android
        run: ./gradlew :app:testFullDebugUnitTest -x buildOperatorEngine -x buildOperatorEngineArm64V8a
